    (function () {
      var t = null;
      try { t = localStorage.getItem('pa-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';

      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#131007');
    })();

  <script>
  /* ============================================================
     Enrutador de URLs limpias (GitHub Pages)
     ------------------------------------------------------------
     Pages solo sirve archivos reales; una ruta como /proyectos o
     /blog/<slug> cae aquí. En lugar de mandar a un .html (feo en la
     barra de direcciones), se trae la página de verdad con fetch,
     sustituye el documento y guarda la URL limpia con replaceState.

     - /blog/<slug>        → /entrada.html (lee el slug del pathname)
     - /proyectos|juegos|blog|comunidad|equipo|contacto → /<página>.html
     Cualquier otra ruta se queda en este 404 de verdad.
     ============================================================ */
  (function () {
    "use strict";
    var path = location.pathname.replace(/\/+$/, "") || "/";
    var target = null;

    var mPost = path.match(/^\/blog\/([A-Za-z0-9\-]+)$/);
    var mPage = path.match(/^\/(proyectos|juegos|blog|comunidad|equipo|contacto)$/);

    if (mPost) {
      target = { src: "/entrada.html", url: path + location.search + location.hash };
    } else if (mPage) {
      target = { src: "/" + mPage[1] + ".html", url: path + location.search + location.hash };
    }
    if (!target) return; /* 404 legítimo: no hay nada que remapear */

    fetch(target.src, { headers: { Accept: "text/html" } })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        if (!doc || !doc.body) throw new Error("documento vacío");

        /* la página que llega ya no es una plantilla: si trae noindex
           (entrada.html lo lleva para no indexar la plantilla), fuera —
           en su URL limpia sí debe poder indexarse */
        var robots = doc.head && doc.head.querySelector('meta[name="robots"]');
        if (robots) robots.remove();

        /* 1) URL limpia en la barra antes de ejecutar los scripts nuevos */
        if (history.replaceState) history.replaceState(null, "", target.url);

        /* 2) sustituir todo el documento por el de la página real */
        document.documentElement.replaceChildren(doc.head, doc.body);

        /* 3) los <script> traídos por fetch no se ejecutan solos:
              recrearlos en el mismo orden (async=false conserva el orden) */
        var scripts = document.querySelectorAll("script");
        for (var i = 0; i < scripts.length; i++) {
          var old = scripts[i];
          var s = document.createElement("script");
          if (old.src) {
            s.src = old.src;
            s.async = false; /* ejecutar en orden de inserción */
          } else {
            s.textContent = old.textContent;
          }
          old.parentNode.replaceChild(s, old);
        }
      })
      .catch(function () {
        /* sin fetch disponible o error: deja el 404 tal cual */
      });
  })();
  </script>
