<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 · Página no encontrada · Pineapple</title>
  <meta name="description" content="Esta página no existe, pero Pineapple sigue en pie.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#131007">

  <link rel="icon" type="image/png" href="assets/img/pineapple.png">
  <meta name="color-scheme" content="dark light">
  <script>
    /* Tema: se aplica ANTES de pintar para evitar parpadeo.
       Orden: localStorage('pa-theme') -> prefers-color-scheme -> dark */
    (function () {
      var t = null;
      try { t = localStorage.getItem('pa-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#faf5ea' : '#131007');
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Pineapple — inicio">
        <img src="assets/img/pineapple.png" alt="" width="34" height="34">
        <span><span translate="no">Pineapple</span><small>Making things a little bit better</small></span>
      </a>

      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar entre tema oscuro y claro" title="Cambiar tema">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="error-hero">
      <div class="wrap">
        <p class="big"><span>404</span> 🍍</p>
        <h1>Esta página se ha escapado</h1>
        <p class="lead" style="margin-top:.6rem;">
          O nunca existió o la hemos movido. Da igual: el resto de la web sigue ahí.
        </p>
        <div class="hero-actions">
          <a class="btn primary" href="index.html">Volver al inicio</a>
          <a class="btn ghost" href="https://pineappleva.github.io/Games/" target="_blank" rel="noopener">🎮 Mejor me echo una partida</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-bottom" style="border-top:0;">
      <p>© <span id="year">2026</span> <span translate="no">Pineapple</span> · Hecho con 🍍 en Valladolid</p>
    </div>
    <div class="wave slow" aria-hidden="true">
      <svg viewBox="0 0 2880 90" preserveAspectRatio="none" focusable="false">
        <defs>
          <linearGradient id="wgF" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2880" y2="0">
            <stop offset="0" stop-color="#f5a623"/>
            <stop offset="1" stop-color="#ffd166"/>
          </linearGradient>
        </defs>
        <g class="wave-move">
          <path d="M0,42 C240,90 480,-6 720,42 C960,90 1200,-6 1440,42 L1440,90 L0,90 Z" fill="url(#wgF)"/>
          <path d="M1440,42 C1680,90 1920,-6 2160,42 C2400,90 2640,-6 2880,42 L2880,90 L1440,90 Z" fill="url(#wgF)"/>
        </g>
      </svg>
    </div>
  </footer>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
